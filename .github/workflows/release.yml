name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist, e.g. v0.1.1-hardened)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-windows:
    name: Package Windows (NSIS + portable)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build renderer + electron bundle
        run: npm run build

      - name: Package Windows installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish=never

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release -Recurse -Include *.exe,*.blockmap,*.yml,*.yaml |
            Where-Object { -not $_.PSIsContainer }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $file.FullName).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Out-File -FilePath release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hypermail-windows-x64
          path: |
            release/HyperMail-*.exe
            release/HyperMail-*.blockmap
            release/latest*.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = Get-ChildItem -Path release -File |
            Where-Object { $_.Name -like "HyperMail-*.exe" -or `
                           $_.Name -like "HyperMail-*.blockmap" -or `
                           $_.Name -like "latest*.yml" -or `
                           $_.Name -eq "SHA256SUMS.txt" }
          foreach ($asset in $assets) {
            Write-Host "Uploading $($asset.FullName) to release $tag"
            gh release upload $tag $asset.FullName --clobber
          }
